# =============================================================================
# Segurança — 4 camadas de proteção
#   1. Auditoria de dependências  (npm audit)
#   2. Análise estática do código (CodeQL / SAST)
#   3. Vazamento de segredos      (Gitleaks)
#   4. Dependências novas em PR   (Dependency Review)
# Roda em PR, push na main e toda segunda-feira (novas CVEs aparecem sempre).
# =============================================================================
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"     # segunda, 09:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------ 1. DEPENDÊNCIAS VULNERÁVEIS
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Falha se houver vulnerabilidade HIGH ou CRITICAL em produção
      - run: npm run audit:prod

  # ----------------------------------------------------------- 2. CODEQL (SAST)
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write      # necessário para publicar alertas
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  # --------------------------------------------------------- 3. SEGREDOS (GITLEAKS)
  secrets-scan:
    name: Gitleaks (segredos vazados)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # histórico completo, para varrer commits antigos
      - name: Instala e roda o Gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose

  # --------------------------------------------------- 4. REVISÃO DE DEPENDÊNCIAS
  dependency-review:
    name: Dependency Review (só em PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
